<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cart | Tidepool Supply</title>
    <link rel="stylesheet" href="/css/styles.css" />
    <script type="module" src="/js/cart-page.js"></script>
  </head>
  <body>
    <header class="site-header">
      <a class="logo" href="/">Tidepool Supply</a>
      <nav aria-label="Main">
        <a href="/">Shop</a>
        <a class="cart-link" href="/cart.html" aria-current="page">Cart <span class="badge" data-testid="cart-count">0</span></a>
      </nav>
    </header>

    <main class="container">
      <h1>Your cart</h1>

      <div class="empty-state" data-testid="empty-cart" hidden>
        <p>Your cart is empty.</p>
        <a class="button" href="/">Continue shopping</a>
      </div>

      <div class="cart-layout" data-testid="cart-content" hidden>
        <ul class="cart-list" data-testid="cart-items"></ul>

        <aside class="summary" aria-label="Order summary">
          <dl>
            <div>
              <dt>Subtotal</dt>
              <dd data-testid="cart-subtotal"></dd>
            </div>
            <div>
              <dt>Shipping</dt>
              <dd data-testid="cart-shipping"></dd>
            </div>
            <div class="summary__total">
              <dt>Total</dt>
              <dd data-testid="cart-total"></dd>
            </div>
          </dl>
          <p class="hint">Free shipping on orders over $100.</p>
          <a class="button button--wide" href="/checkout.html">Proceed to checkout</a>
        </aside>
      </div>
    </main>
  </body>
</html>
